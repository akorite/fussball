[project]
name = "fussball"
version = "0.1.0"
description = "ML system for soccer over/under 2.5 goals prediction across the top 5 European leagues"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "fussball contributors" },
]
keywords = ["machine-learning", "soccer", "betting", "lightgbm", "sports-analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "lightgbm>=4.6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "optuna>=4.0",
    "click>=8.1",
    "pydantic>=2.7",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "tqdm>=4.66",
    "joblib>=1.4",
    "requests>=2.32",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
fussball = "fussball.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fussball"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:optuna.*",
    "ignore::DeprecationWarning:lightgbm.*",
    "ignore::UserWarning:lightgbm.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external resources",
]

[tool.coverage.run]
source = ["src/fussball"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in defaults (pydantic Field pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
